<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>내부 일정 보드 | 아성보이스</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/ops-board.css?v=20260825j">
<link rel="icon" href="../assets/images/logo.png?v=2" type="image/png">
</head>
<body class="ops">

<section id="login" class="ops-login">
  <div class="ops-login__card">
    <div class="ops-login__brand">
      <img src="../assets/images/logo.png?v=2" alt="">
      <span>아성<em>보이스</em></span>
    </div>
    <h1>내부 일정 보드</h1>
    <p>본인 이름을 선택한 다음 비밀번호를 넣고 들어가기를 누르세요.</p>
    <form id="login-form">
      <div id="user-list" class="ops-users" role="radiogroup" aria-label="로그인할 사람"></div>
      <label for="login-pass">비밀번호</label>
      <input id="login-pass" type="password" autocomplete="current-password" required>
      <p id="login-error" class="ops-err"></p>
      <button class="ops-btn ops-btn--blue" id="login-submit" type="submit">들어가기</button>
    </form>
    <p class="ops-login__foot">일정을 바꾸면 바로 저장됩니다. 다른 사람으로 바꿀 때만 로그아웃하면 됩니다.</p>
  </div>
</section>

<div id="app" class="ops-app" hidden>
  <aside class="ops-side">
    <div class="ops-side__top">
      <img src="../assets/images/logo.png?v=2" alt="">
      <strong>아성보이스</strong>
    </div>
    <button class="ops-nav" data-page="home">홈</button>
    <button class="ops-nav is-on" data-page="timeline">타임라인</button>
    <div class="ops-side__label">프로젝트</div>
    <button class="ops-nav" data-page="table" data-project="watchdog"><span class="dot-watchdog"></span>워치독</button>
    <button class="ops-nav" data-page="table" data-project="ansimi"><span class="dot-ansimi"></span>마이안심이</button>
    <button class="ops-nav" data-page="table" data-project="switch"><span class="dot-switch"></span>일괄소등</button>
    <button class="ops-nav" data-page="table" data-project="bell"><span class="dot-bell"></span>비상벨</button>
    <div class="ops-side__label">경영</div>
    <button class="ops-nav" data-page="table" data-lane="sales">영업</button>
    <button class="ops-nav" data-page="table" data-lane="invest">투자</button>
    <button class="ops-nav" data-page="activity">활동 기록</button>
    <button class="ops-nav" data-page="settings">설정</button>
    <div class="ops-side__me">
      <b id="me-name"></b><br>
      <span id="me-role"></span>
      <div style="margin-top:8px">
        <button class="ops-btn ops-btn--ghost ops-btn--sm" id="btn-logout" type="button">로그아웃</button>
      </div>
    </div>
  </aside>
  <div class="ops-main">
    <header class="ops-top">
      <h2 id="page-title">홈</h2>
      <span id="save-status" class="ops-status"></span>
      <button class="ops-btn ops-btn--ghost ops-btn--sm" id="btn-add" type="button">+ 일정 추가</button>
      <button class="ops-btn ops-btn--blue ops-btn--sm" id="btn-save" type="button">저장</button>
    </header>
    <div id="view" class="ops-view"></div>
  </div>
</div>

<script src="../js/ops-board.js?v=20260825j"></script>
</body>
</html>
